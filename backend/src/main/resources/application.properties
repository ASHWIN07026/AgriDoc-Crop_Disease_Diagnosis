# ============================================================
# AgriDoc - Application Configuration
# For Render deployment: set env vars PORT, DB_URL, DB_USERNAME,
# DB_PASSWORD, GEMINI_API_KEY in the Render dashboard.
# Without those, the app uses H2 in-memory/file DB (see DatabaseConfig.java).
# ============================================================

# Server Configuration - Render uses PORT env var; fallback to 8080 for local dev
server.port=${PORT:8080}
server.address=0.0.0.0

# Database Configuration (used by DatabaseConfig.java for MySQL detection)
# Override with environment variables on Render if you have an external MySQL:
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agridoc?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File Upload Configuration
# NOTE: On Render free tier, the local filesystem is ephemeral.
# Files uploaded will be lost after a restart/redeploy.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads/

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.agridoc=DEBUG

# Google Gemini API Configuration
# Set GEMINI_API_KEY as an environment variable in the Render dashboard.
gemini.api.key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-1.5-flash
